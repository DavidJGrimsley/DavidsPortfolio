name: CI

on:
  pull_request:
    branches:
      - test
      - main
  push:
    branches:
      - test
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_SITE_URL: https://quizzical-hofstadter.108-175-12-95.plesk.page
  PRODUCTION_SITE_URL: https://davidjgrimsley.com

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Expo doctor
        run: npm run doctor

      - name: Build web deploy bundle
        env:
          EXPO_PUBLIC_QUANTUM_API_BASE_URL: https://davidjgrimsley.com/public-facing/api/quantum/v1
        run: npm run build:web:deploy

      - name: Show build marker outputs
        shell: bash
        run: |
          ls -la dist/client
          echo "__djsportfolio_build.txt"
          cat dist/client/__djsportfolio_build.txt
          echo "__djsportfolio_build.json"
          cat dist/client/__djsportfolio_build.json

      - name: Upload quality build artifact
        uses: actions/upload-artifact@v7
        with:
          name: quality-dist-client-${{ github.sha }}
          path: dist/client
          if-no-files-found: error
          retention-days: 7

  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Validate staging deploy secrets
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "${PLESK_STAGING_WEBHOOK_URL}" ]; then
            echo "Missing secret: PLESK_STAGING_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger staging deploy webhook
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "${PLESK_STAGING_WEBHOOK_URL}"

      - name: Verify staging deployment
        env:
          SITE_URL: ${{ env.STAGING_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "staging" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --interval-ms 10000 \
            --timeout-ms 360000

  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Validate production deploy secrets
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "${PLESK_PRODUCTION_WEBHOOK_URL}" ]; then
            echo "Missing secret: PLESK_PRODUCTION_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger production deploy webhook
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "${PLESK_PRODUCTION_WEBHOOK_URL}"

      - name: Verify production deployment
        env:
          SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "production" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --interval-ms 10000 \
            --timeout-ms 360000

