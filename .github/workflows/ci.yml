name: CI

on:
  pull_request:
    branches:
      - test
      - main
  push:
    branches:
      - test
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  STAGING_SITE_URL: https://quizzical-hofstadter.108-175-12-95.plesk.page
  PRODUCTION_SITE_URL: https://davidjgrimsley.com

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.8

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Expo doctor
        run: npm run doctor

      - name: Build web deploy bundle
        env:
          EXPO_PUBLIC_QUANTUM_API_BASE_URL: https://davidjgrimsley.com/public-facing/api/quantum/v1
        run: npm run build:web:deploy

      - name: Show build marker outputs
        shell: bash
        run: |
          ls -la dist/client
          echo "__djsportfolio_build.txt"
          cat dist/client/__djsportfolio_build.txt
          echo "__djsportfolio_build.json"
          cat dist/client/__djsportfolio_build.json

      - name: Smoke test production server startup
        shell: bash
        env:
          PORT: 4173
          EXPO_PUBLIC_SITE_ORIGIN: http://127.0.0.1:4173
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          EXPO_PUBLIC_QUANTUM_API_BASE_URL: https://davidjgrimsley.com/public-facing/api/quantum/v1
          QUANTUM_BACKEND_API_KEY: ci-backend-key
        run: |
          require_grep() {
            label="$1"
            pattern="$2"
            file="$3"

            if ! grep -q "$pattern" "$file"; then
              echo "Missing ${label} (${pattern}) in ${file}"
              echo "--- ${file} first 1200 bytes ---"
              head -c 1200 "$file"
              echo
              exit 1
            fi
          }

          require_header() {
            label="$1"
            pattern="$2"
            file="$3"

            if ! grep -Eiq "$pattern" "$file"; then
              echo "Missing ${label} (${pattern}) in ${file}"
              echo "--- ${file} ---"
              cat "$file"
              exit 1
            fi
          }

          node server.js > server-smoke.log 2>&1 &
          server_pid=$!

          cleanup() {
            status=$?
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat server-smoke.log
            fi
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/__djsportfolio_runtime_config__" >/tmp/djsportfolio-runtime.js; then
              curl --fail --silent --show-error "http://127.0.0.1:${PORT}/__djsportfolio_build.json" >/tmp/djsportfolio-build.json
              curl --fail --silent --show-error "http://127.0.0.1:${PORT}/" >/tmp/djsportfolio-home.html
              curl --fail --silent --show-error "http://127.0.0.1:${PORT}/public-facing/api/quantum" >/tmp/djsportfolio-api-quantum.html
              curl --fail --silent --show-error "http://127.0.0.1:${PORT}/public-facing/mcp" >/tmp/djsportfolio-mcp.html
              curl --fail --silent --show-error \
                --header "Host: quizzical-hofstadter.108-175-12-95.plesk.page" \
                --header "Accept: text/html" \
                --dump-header /tmp/djsportfolio-staging-host.headers \
                --output /tmp/djsportfolio-staging-host.html \
                "http://127.0.0.1:${PORT}/"

              require_grep "home content" "David" /tmp/djsportfolio-home.html
              require_grep "production stylesheet" "_expo/static/css" /tmp/djsportfolio-api-quantum.html
              require_grep "API loader data" "__EXPO_ROUTER_LOADER_DATA__" /tmp/djsportfolio-api-quantum.html
              require_grep "Quantum API data" "Quantum API" /tmp/djsportfolio-api-quantum.html
              require_grep "MCP loader data" "__EXPO_ROUTER_LOADER_DATA__" /tmp/djsportfolio-mcp.html
              require_grep "MCP data" "mrdj-app-mcp" /tmp/djsportfolio-mcp.html
              require_header "staging cache reset header" "^clear-site-data:.*cache.*storage" /tmp/djsportfolio-staging-host.headers

              if grep -q 'Failed to load loader data' /tmp/djsportfolio-api-quantum.html /tmp/djsportfolio-mcp.html; then
                echo "SSR route smoke found loader failure text"
                exit 1
              fi

              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "server.js exited before it became ready"
              exit 1
            fi

            sleep 1
          done

          echo "server.js did not become ready"
          exit 1

      - name: Upload quality build artifact
        uses: actions/upload-artifact@v7
        with:
          name: quality-dist-client-${{ github.sha }}
          path: dist/client
          if-no-files-found: error
          retention-days: 7

  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: quality
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/test') ||
      (
        github.event_name == 'pull_request' &&
        github.base_ref == 'test' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "EXPECTED_DEPLOY_SHA=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
            echo "EXPECTED_DEPLOY_REF=${{ github.head_ref }}" >> "$GITHUB_ENV"
          else
            echo "EXPECTED_DEPLOY_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
            echo "EXPECTED_DEPLOY_REF=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Validate staging deploy secrets
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "${PLESK_STAGING_WEBHOOK_URL}" ]; then
            echo "Missing secret: PLESK_STAGING_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger staging deploy webhook
        env:
          PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}
        run: |
          echo "Requesting staging deploy for ${EXPECTED_DEPLOY_REF} at ${EXPECTED_DEPLOY_SHA}"
          curl --fail --silent --show-error --request POST "${PLESK_STAGING_WEBHOOK_URL}"

      - name: Verify staging deployment
        env:
          SITE_URL: ${{ env.STAGING_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "staging" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --expected-sha "$EXPECTED_DEPLOY_SHA" \
            --interval-ms 10000 \
            --timeout-ms 360000

  deploy_production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23

      - name: Capture deploy start time
        run: |
          echo "DEPLOY_STARTED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Validate production deploy secrets
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "${PLESK_PRODUCTION_WEBHOOK_URL}" ]; then
            echo "Missing secret: PLESK_PRODUCTION_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger production deploy webhook
        env:
          PLESK_PRODUCTION_WEBHOOK_URL: ${{ secrets.PLESK_PRODUCTION_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "${PLESK_PRODUCTION_WEBHOOK_URL}"

      - name: Verify production deployment
        env:
          SITE_URL: ${{ env.PRODUCTION_SITE_URL }}
        run: |
          node ./scripts/verify-deployment.mjs \
            --label "production" \
            --site-url "$SITE_URL" \
            --not-before "$DEPLOY_STARTED_AT" \
            --expected-sha "$GITHUB_SHA" \
            --interval-ms 10000 \
            --timeout-ms 360000

