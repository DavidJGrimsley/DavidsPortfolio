name: CI

on:
  pull_request:
    branches:
      - test
      - main
  push:
    branches:
      - test
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 23
        uses: actions/setup-node@v6
        with:
          node-version: 23
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build web bundle
        env:
          EXPO_PUBLIC_QUANTUM_API_BASE_URL: https://davidjgrimsley.com/public-facing/api/quantum/v1
        run: npm run build:web

  deploy_staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/test'
    timeout-minutes: 5
    env:
      PLESK_STAGING_WEBHOOK_URL: ${{ secrets.PLESK_STAGING_WEBHOOK_URL }}

    steps:
      - name: Validate staging deploy secrets
        shell: bash
        run: |
          if [ -z "${PLESK_STAGING_WEBHOOK_URL}" ]; then
            echo "Missing secret: PLESK_STAGING_WEBHOOK_URL"
            exit 1
          fi

      - name: Trigger staging deploy webhook
        shell: bash
        run: |
          curl --fail --silent --show-error --request POST "${PLESK_STAGING_WEBHOOK_URL}"
