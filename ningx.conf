#
# NOTE: /api and /api/quantum pages are served by your portfolio website (Expo/React)
# Only proxy specific API endpoints and docs to the Flask app

# Proxy API endpoints to the Flask app running locally
location ~ ^/public-facing/api/quantum/(quantum_text|quantum_gate|quantum_echo_types|health|portfolio\.json)$ {
	proxy_pass http://127.0.0.1:8000;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Port $server_port;
	# CORS is handled by Flask - don't add duplicate headers here
}

# Proxy Swagger UI to Flask app (exact match for priority)
location = /public-facing/api/quantum/docs {
	proxy_pass http://127.0.0.1:8000;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

# Proxy OpenAPI spec to Flask app (exact match for priority)
location = /public-facing/api/quantum/openapi.yaml {
	proxy_pass http://127.0.0.1:8000;
	proxy_set_header Host $host;
	add_header Content-Type application/x-yaml;
}

##
## NGINX Configuration for mrdj-app-mcp

# MCP endpoint (Streamable HTTP + SSE). VS Code and other MCP clients connect here.
location /public-facing/mcp/mrdj-app-mcp/mcp {
	proxy_pass http://127.0.0.1:4000/mcp;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection 'upgrade';
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_cache_bypass $http_upgrade;
	proxy_buffering off;
	proxy_read_timeout 86400s;
	proxy_send_timeout 86400s;
}

# SSE message POST endpoint (required for legacy SSE transport)
location /public-facing/mcp/mrdj-app-mcp/messages {
	proxy_pass http://127.0.0.1:4000/mcp/messages;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_buffering off;
}

# Health check endpoint
location /public-facing/mcp/mrdj-app-mcp/health {
	proxy_pass http://127.0.0.1:4000/health;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

# Portfolio metadata endpoint (public JSON for portfolio UI)
location /public-facing/mcp/mrdj-app-mcp/portfolio.json {
	proxy_pass http://127.0.0.1:4000/portfolio.json;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

